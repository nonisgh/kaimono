name: Supabase keep-alive

# 7日間アクティビティが無いとSupabase無料プロジェクトは一時停止される。
# 週2回（月・木）軽いSELECTを投げてタイマーをリセットする。
# 手動実行もできる（Actionsタブ → Run workflow）。

on:
  schedule:
    - cron: '23 15 * * 1,4'   # 毎週 月・木 15:23 UTC（=日本時間 翌 00:23 ごろ）。UTC基準なので注意
  workflow_dispatch:           # 手動でも回せる

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST (zones を1件SELECT)
        run: |
          URL="https://kfslyphplctdfjiwsjut.supabase.co/rest/v1/zones?select=code&limit=1"
          KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtmc2x5cGhwbGN0ZGZqaXdzanV0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA5NDkzMjQsImV4cCI6MjA5NjUyNTMyNH0.EAo76m7MLbeLFYZvAQVb6zMfzYlovMbCS_6wefYzsYQ"
          code=$(curl -sS -o /tmp/out.txt -w "%{http_code}" "$URL" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $code"
          cat /tmp/out.txt
          # 2xx以外なら失敗扱いにして気付けるように
          [ "${code:0:1}" = "2" ] || exit 1
