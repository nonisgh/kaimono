<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おかいものメモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ec;
    --paper2:#f3ecdc;
    --card:#fffdf8;
    --ink:#3a352b;
    --ink-soft:#8a8472;
    --line:#e7ddc7;
    --green:#5b8a4f;
    --green-d:#456b3c;
    --green-soft:#e6efe0;
    --coral:#e0764f;
    --coral-soft:#f7e3d8;
    --gold:#d9a441;
    --shadow:0 2px 0 #ece3cf, 0 8px 20px -10px rgba(80,70,40,.35);
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Zen Maru Gothic',system-ui,sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, #fff8ea 0%, var(--paper) 55%) fixed;
    color:var(--ink);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:120px;
  }
  .wrap{max-width:480px;margin:0 auto;padding:0 14px;}

  /* ---- header ---- */
  header{
    position:sticky;top:0;z-index:40;
    background:linear-gradient(180deg,var(--paper) 70%, rgba(251,246,236,.0));
    padding:14px 0 8px;
  }
  .titlebar{display:flex;align-items:center;gap:10px;}
  .logo{
    width:42px;height:42px;border-radius:13px;
    background:var(--green);color:#fff;
    display:grid;place-items:center;font-size:22px;
    box-shadow:0 3px 0 var(--green-d);
    transform:rotate(-4deg);
  }
  h1{font-size:21px;font-weight:900;margin:0;letter-spacing:.02em;}
  .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}

  /* who toggle */
  .whorow{display:flex;align-items:center;gap:8px;margin-top:12px;}
  .whorow .lab{font-size:12px;color:var(--ink-soft);}
  .seg{display:flex;background:var(--paper2);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;}
  .seg button{
    border:0;background:transparent;font-family:inherit;font-weight:700;
    font-size:13px;color:var(--ink-soft);padding:6px 16px;border-radius:999px;cursor:pointer;
    transition:.18s;
  }
  .seg button.on.me{background:var(--green);color:#fff;box-shadow:0 2px 0 var(--green-d);}
  .seg button.on.mom{background:var(--coral);color:#fff;box-shadow:0 2px 0 #b85733;}

  /* tabs */
  .tabs{display:flex;gap:6px;margin-top:12px;}
  .tabs button{
    flex:1;border:1.5px solid var(--line);background:var(--card);
    font-family:inherit;font-weight:700;font-size:14px;color:var(--ink-soft);
    padding:9px 0;border-radius:13px 13px 0 0;cursor:pointer;border-bottom:none;
    transition:.15s;
  }
  .tabs button.active{color:var(--green-d);background:var(--green-soft);border-color:#cfe0c4;}

  /* progress */
  .prog{
    display:flex;align-items:center;gap:10px;margin:12px 0 4px;
    background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow);
  }
  .prog .big{font-size:22px;font-weight:900;color:var(--green-d);}
  .prog .small{font-size:12px;color:var(--ink-soft);}
  .bar{flex:1;height:10px;background:var(--paper2);border-radius:999px;overflow:hidden;}
  .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--green),#7cae63);border-radius:999px;transition:width .35s;}

  /* add bar */
  .addbar{
    display:flex;gap:8px;margin:14px 0;
  }
  .addbar input{
    flex:1;font-family:inherit;font-size:17px;font-weight:500;
    border:2px solid var(--line);background:var(--card);border-radius:14px;
    padding:13px 15px;color:var(--ink);outline:none;transition:.15s;
  }
  .addbar input:focus{border-color:var(--green);background:#fff;}
  .addbtn{
    border:0;background:var(--green);color:#fff;font-family:inherit;font-weight:900;font-size:16px;
    padding:0 20px;border-radius:14px;cursor:pointer;box-shadow:0 3px 0 var(--green-d);
    transition:.1s;white-space:nowrap;
  }
  .addbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d);}

  /* category group */
  .cat{margin-top:18px;}
  .cathead{display:flex;align-items:center;gap:8px;margin:0 4px 8px;}
  .cathead .ico{font-size:18px;}
  .cathead .nm{font-size:13px;font-weight:700;color:var(--ink-soft);letter-spacing:.04em;}
  .cathead .ln{flex:1;height:1.5px;background:var(--line);border-radius:2px;}

  /* item */
  .item{
    display:flex;align-items:center;gap:13px;
    background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;margin-bottom:9px;box-shadow:var(--shadow);
    transition:.18s;position:relative;overflow:hidden;
  }
  .item:active{transform:scale(.99);}
  .check{
    width:30px;height:30px;border-radius:10px;border:2.5px solid var(--line);
    flex:none;display:grid;place-items:center;cursor:pointer;transition:.15s;
    background:var(--paper);
  }
  .check svg{width:18px;height:18px;opacity:0;transform:scale(.4);transition:.18s;}
  .body{flex:1;min-width:0;cursor:pointer;}
  .nm{font-size:18px;font-weight:700;line-height:1.2;}
  .meta{display:flex;align-items:center;gap:8px;margin-top:3px;}
  .qty{font-size:12px;font-weight:700;color:var(--green-d);background:var(--green-soft);padding:1px 8px;border-radius:999px;}
  .by{font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;}
  .by.me{color:var(--green-d);background:var(--green-soft);}
  .by.mom{color:#b85733;background:var(--coral-soft);}

  .item.done{opacity:.55;}
  .item.done .check{background:var(--green);border-color:var(--green);}
  .item.done .check svg{opacity:1;transform:scale(1);}
  .item.done .nm{text-decoration:line-through;text-decoration-color:var(--ink-soft);}

  .empty{text-align:center;color:var(--ink-soft);padding:50px 20px;font-weight:500;}
  .empty .e{font-size:40px;margin-bottom:10px;}

  /* checkout button (floating) */
  .footer{
    position:fixed;left:0;right:0;bottom:0;z-index:50;
    padding:12px 14px calc(12px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,var(--paper) 65%, rgba(251,246,236,0));
    pointer-events:none;
  }
  .footer .inner{max-width:480px;margin:0 auto;pointer-events:auto;}
  .checkout{
    width:100%;border:0;font-family:inherit;font-weight:900;font-size:17px;color:#fff;
    background:var(--coral);padding:16px;border-radius:16px;cursor:pointer;
    box-shadow:0 4px 0 #b85733, 0 10px 24px -8px rgba(180,87,51,.5);
    transition:.1s;display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .checkout:active{transform:translateY(3px);box-shadow:0 1px 0 #b85733;}
  .checkout:disabled{background:#cdc6b4;box-shadow:0 4px 0 #b3ab98;cursor:default;color:#fff;}

  /* history */
  .daygroup{margin-top:18px;}
  .dayhead{font-size:13px;font-weight:900;color:var(--green-d);margin:0 4px 8px;}
  .hitem{
    display:flex;align-items:center;gap:10px;background:var(--card);
    border:1.5px solid var(--line);border-radius:13px;padding:11px 14px;margin-bottom:7px;
  }
  .hitem .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;}
  .hitem .hn{font-size:15px;font-weight:500;flex:1;}
  .hitem .ht{font-size:11px;color:var(--ink-soft);}

  /* edit sheet */
  .sheetbg{
    position:fixed;inset:0;background:rgba(58,53,43,.45);z-index:60;
    opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(2px);
  }
  .sheetbg.open{opacity:1;pointer-events:auto;}
  .sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:61;
    background:var(--paper);border-radius:24px 24px 0 0;
    max-width:480px;margin:0 auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));
    transform:translateY(110%);transition:.28s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);
  }
  .sheet.open{transform:translateY(0);}
  .grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:6px auto 14px;}
  .sheet h3{margin:0 0 14px;font-size:18px;font-weight:900;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input{
    width:100%;font-family:inherit;font-size:17px;font-weight:500;
    border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;outline:none;
  }
  .field input:focus{border-color:var(--green);}
  .qstep{display:flex;align-items:center;gap:14px;}
  .qstep button{
    width:46px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--card);
    font-size:24px;font-weight:900;color:var(--green-d);cursor:pointer;font-family:inherit;
  }
  .qstep .v{font-size:22px;font-weight:900;min-width:36px;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;gap:7px;}
  .chip{
    border:2px solid var(--line);background:var(--card);font-family:inherit;font-weight:700;font-size:13px;
    padding:7px 12px;border-radius:999px;cursor:pointer;color:var(--ink-soft);transition:.12s;
  }
  .chip.on{background:var(--green);color:#fff;border-color:var(--green);}
  .sheetbtns{display:flex;gap:10px;margin-top:6px;}
  .sheetbtns button{flex:1;font-family:inherit;font-weight:900;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;border:0;}
  .b-del{background:var(--coral-soft);color:#b85733;}
  .b-save{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);}

  /* toast */
  .toast{
    position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);
    background:var(--ink);color:#fff;font-size:13px;font-weight:700;
    padding:10px 18px;border-radius:999px;z-index:80;opacity:0;transition:.25s;
    box-shadow:0 8px 20px -6px rgba(0,0,0,.4);max-width:90%;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hidden{display:none !important;}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="titlebar">
      <div class="logo">🧺</div>
      <div>
        <h1>おかいものメモ</h1>
        <div class="sub">ふたりで つくる かいものリスト</div>
      </div>
    </div>

    <div class="whorow">
      <span class="lab">追加するのは</span>
      <div class="seg" id="whoSeg">
        <button class="on me" data-who="me">自分</button>
        <button class="mom" data-who="mom">お母さん</button>
      </div>
    </div>

    <div class="tabs">
      <button class="active" data-tab="list">📝 リスト</button>
      <button data-tab="hist">📚 買ったもの</button>
    </div>
  </header>

  <!-- LIST TAB -->
  <main id="listTab">
    <div class="prog">
      <div>
        <div class="big"><span id="remain">0</span><span style="font-size:14px;color:var(--ink-soft);">こ</span></div>
        <div class="small">のこり</div>
      </div>
      <div class="bar"><i id="barFill" style="width:0%"></i></div>
      <div class="small" id="progTxt">0/0</div>
    </div>

    <div class="addbar">
      <input id="addInput" type="text" placeholder="例）牛乳、たまご…" enterkeyhint="done">
      <button class="addbtn" id="addBtn">追加</button>
    </div>

    <div id="listArea"></div>
  </main>

  <!-- HISTORY TAB -->
  <main id="histTab" class="hidden">
    <div id="histArea"></div>
  </main>
</div>

<!-- footer checkout -->
<div class="footer" id="footer">
  <div class="inner">
    <button class="checkout" id="checkoutBtn" disabled>
      <span>🛒</span><span id="checkoutTxt">カゴに入れたものを記録</span>
    </button>
  </div>
</div>

<!-- edit sheet -->
<div class="sheetbg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheetTitle">編集</h3>
  <div class="field">
    <label>なまえ</label>
    <input id="editName" type="text">
  </div>
  <div class="field">
    <label>こすう</label>
    <div class="qstep">
      <button id="qMinus">−</button>
      <span class="v" id="qVal">1</span>
      <button id="qPlus">＋</button>
    </div>
  </div>
  <div class="field">
    <label>うりば</label>
    <div class="chips" id="catChips"></div>
  </div>
  <div class="sheetbtns">
    <button class="b-del" id="delBtn">削除</button>
    <button class="b-save" id="saveBtn">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ====== カテゴリ（店を回る順）====== */
const CATS = [
  {id:'veg',  ico:'🥬', nm:'野菜・くだもの'},
  {id:'meat', ico:'🥩', nm:'肉・魚'},
  {id:'dairy',ico:'🥛', nm:'乳製品・たまご'},
  {id:'bread',ico:'🍞', nm:'パン・主食'},
  {id:'froz', ico:'🧊', nm:'冷凍・おそうざい'},
  {id:'cond', ico:'🧂', nm:'調味料・かんぶつ'},
  {id:'drink',ico:'🧃', nm:'飲み物'},
  {id:'snack',ico:'🍪', nm:'おかし'},
  {id:'daily',ico:'🧻', nm:'日用品'},
  {id:'etc',  ico:'🛒', nm:'その他'},
];
const catOf = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];

/* ====== なまえからうりばを推測 ====== */
const GUESS = {
  veg:['野菜','やさい','トマト','きゅうり','なす','レタス','キャベツ','にんじん','人参','たまねぎ','玉ねぎ','じゃがいも','ねぎ','りんご','りんご','バナナ','みかん','いちご','ぶどう','ほうれん草','もやし','きのこ','しめじ','大根','だいこん'],
  meat:['肉','にく','豚','鶏','とり','牛','ぎゅう','ひき肉','ベーコン','ウインナー','魚','さかな','鮭','さけ','まぐろ','刺身','えび','いか'],
  dairy:['牛乳','ぎゅうにゅう','たまご','卵','ヨーグルト','チーズ','バター','生クリーム'],
  bread:['パン','食パン','米','こめ','ごはん','パスタ','うどん','そば','麺','ラーメン'],
  froz:['冷凍','アイス','おそうざい','惣菜','弁当','コロッケ', 'からあげ','餃子','ぎょうざ'],
  cond:['塩','しお','砂糖','さとう','醤油','しょうゆ','味噌','みそ','油','あぶら','ソース','ケチャップ','マヨ','だし','こしょう','酢','みりん','小麦粉','片栗粉','のり','乾物'],
  drink:['水','お茶','おちゃ','ジュース','コーヒー','ビール','牛乳','炭酸','コーラ','酒','ワイン'],
  snack:['おかし','お菓子','チョコ','クッキー','せんべい','ポテチ','ガム','あめ','プリン','ケーキ'],
  daily:['ティッシュ','トイレ','洗剤','せっけん','石鹸','シャンプー','ラップ','ゴミ袋','歯磨き','電池','ペーパー'],
};
function guessCat(name){
  for(const c of CATS){
    const ws = GUESS[c.id]; if(!ws) continue;
    if(ws.some(w=> name.includes(w))) return c.id;
  }
  return 'etc';
}

/* ====== モックデータ ====== */
let items = [
  {id:1, name:'牛乳',      qty:2, cat:'dairy', by:'mom',  done:false},
  {id:2, name:'たまご',    qty:1, cat:'dairy', by:'me',   done:false},
  {id:3, name:'トマト',    qty:3, cat:'veg',   by:'mom',  done:false},
  {id:4, name:'ほうれん草',qty:1, cat:'veg',   by:'me',   done:false},
  {id:5, name:'鶏もも肉',  qty:2, cat:'meat',  by:'me',   done:false},
  {id:6, name:'食パン',    qty:1, cat:'bread', by:'mom',  done:false},
  {id:7, name:'しょうゆ',  qty:1, cat:'cond',  by:'mom',  done:false},
  {id:8, name:'トイレットペーパー', qty:1, cat:'daily', by:'me', done:false},
];
let history = [
  {date:'6月7日(土)', list:[{name:'お米 5kg',time:'17:42'},{name:'味噌',time:'17:40'},{name:'りんご',time:'17:31'}]},
];
let seq = 100;
let currentWho = 'me';
let editing = null;
let editCat = 'etc';
let editQty = 1;

/* ====== 描画 ====== */
const $ = s => document.querySelector(s);
const listArea = $('#listArea');

function render(){
  // progress
  const total = items.length;
  const done = items.filter(i=>i.done).length;
  const remain = total - done;
  $('#remain').textContent = remain;
  $('#progTxt').textContent = `${done}/${total}`;
  $('#barFill').style.width = total ? (done/total*100)+'%' : '0%';

  // checkout button
  const cbtn = $('#checkoutBtn');
  cbtn.disabled = done===0;
  $('#checkoutTxt').textContent = done>0 ? `カゴの ${done}こ を記録する` : 'カゴに入れたものを記録';

  // list grouped by category order
  if(items.length===0){
    listArea.innerHTML = `<div class="empty"><div class="e">🪶</div>リストは からっぽ<br>上から ついかしてね</div>`;
    return;
  }
  let html = '';
  for(const c of CATS){
    const its = items.filter(i=>i.cat===c.id).sort((a,b)=>a.done-b.done);
    if(its.length===0) continue;
    html += `<div class="cat"><div class="cathead"><span class="ico">${c.ico}</span><span class="nm">${c.nm}</span><span class="ln"></span></div>`;
    for(const it of its){
      html += `<div class="item ${it.done?'done':''}" data-id="${it.id}">
        <div class="check" data-act="toggle">
          <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div class="body" data-act="edit">
          <div class="nm">${esc(it.name)}</div>
          <div class="meta">
            ${it.qty>1?`<span class="qty">×${it.qty}</span>`:''}
            <span class="by ${it.by}">${it.by==='me'?'自分':'母'}</span>
          </div>
        </div>
      </div>`;
    }
    html += `</div>`;
  }
  listArea.innerHTML = html;
}

function renderHist(){
  const area = $('#histArea');
  if(history.length===0){ area.innerHTML = `<div class="empty"><div class="e">📦</div>まだ 記録は ないよ</div>`; return; }
  let html='';
  for(const d of history){
    html += `<div class="daygroup"><div class="dayhead">${d.date}</div>`;
    for(const it of d.list){
      html += `<div class="hitem"><span class="dot"></span><span class="hn">${esc(it.name)}</span><span class="ht">${it.time}</span></div>`;
    }
    html += `</div>`;
  }
  area.innerHTML = html;
}

function esc(s){return String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}

/* ====== 追加 ====== */
function addItem(){
  const inp = $('#addInput');
  const raw = inp.value.trim();
  if(!raw) return;
  // 「牛乳 2」「たまご2」みたいに末尾の数字をこすうに
  let name = raw, qty = 1;
  const m = raw.match(/^(.+?)\s*[×x*]?\s*(\d+)$/);
  if(m){ name = m[1].trim(); qty = Math.min(99, parseInt(m[2])); }
  items.push({id:seq++, name, qty, cat:guessCat(name), by:currentWho, done:false});
  inp.value='';
  render();
  toast(`${currentWho==='me'?'自分':'お母さん'}が「${name}」を追加`);
}

/* ====== トースト ====== */
let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(()=>t.classList.remove('show'),1800);
}

/* ====== 会計（履歴へ）====== */
function checkout(){
  const done = items.filter(i=>i.done);
  if(done.length===0) return;
  const now = new Date();
  const wd = ['日','月','火','水','木','金','土'][now.getDay()];
  const dlabel = `${now.getMonth()+1}月${now.getDate()}日(${wd})`;
  const tlabel = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const entries = done.map(i=>({name: i.qty>1?`${i.name} ×${i.qty}`:i.name, time:tlabel}));
  let day = history.find(d=>d.date===dlabel);
  if(day){ day.list = entries.concat(day.list); }
  else { history.unshift({date:dlabel, list:entries}); }
  items = items.filter(i=>!i.done);
  render(); renderHist();
  toast(`${done.length}こ を記録しました 🎉`);
}

/* ====== 編集シート ====== */
function openEdit(it){
  editing = it; editCat = it.cat; editQty = it.qty;
  $('#sheetTitle').textContent = 'へんしゅう';
  $('#editName').value = it.name;
  $('#qVal').textContent = editQty;
  renderCatChips();
  $('#sheetBg').classList.add('open');
  $('#sheet').classList.add('open');
}
function closeEdit(){
  $('#sheetBg').classList.remove('open');
  $('#sheet').classList.remove('open');
  editing=null;
}
function renderCatChips(){
  $('#catChips').innerHTML = CATS.map(c=>
    `<button class="chip ${c.id===editCat?'on':''}" data-cat="${c.id}">${c.ico} ${c.nm}</button>`
  ).join('');
}

/* ====== イベント ====== */
$('#addBtn').addEventListener('click', addItem);
$('#addInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addItem(); });

$('#whoSeg').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  currentWho = b.dataset.who;
  [...$('#whoSeg').children].forEach(x=>x.classList.remove('on'));
  b.classList.add('on');
});

document.querySelector('.tabs').addEventListener('click', e=>{
  const b = e.target.closest('button'); if(!b) return;
  [...document.querySelector('.tabs').children].forEach(x=>x.classList.remove('active'));
  b.classList.add('active');
  const tab = b.dataset.tab;
  $('#listTab').classList.toggle('hidden', tab!=='list');
  $('#histTab').classList.toggle('hidden', tab!=='hist');
  $('#footer').classList.toggle('hidden', tab!=='list');
  if(tab==='hist') renderHist();
});

listArea.addEventListener('click', e=>{
  const row = e.target.closest('.item'); if(!row) return;
  const id = +row.dataset.id;
  const it = items.find(i=>i.id===id); if(!it) return;
  const act = e.target.closest('[data-act]')?.dataset.act;
  if(act==='toggle'){ it.done=!it.done; render(); }
  else if(act==='edit'){ openEdit(it); }
});

$('#checkoutBtn').addEventListener('click', checkout);

// sheet controls
$('#sheetBg').addEventListener('click', closeEdit);
$('#qMinus').addEventListener('click', ()=>{ editQty=Math.max(1,editQty-1); $('#qVal').textContent=editQty; });
$('#qPlus').addEventListener('click', ()=>{ editQty=Math.min(99,editQty+1); $('#qVal').textContent=editQty; });
$('#catChips').addEventListener('click', e=>{
  const b=e.target.closest('.chip'); if(!b) return;
  editCat=b.dataset.cat; renderCatChips();
});
$('#saveBtn').addEventListener('click', ()=>{
  if(!editing) return;
  editing.name = $('#editName').value.trim() || editing.name;
  editing.qty = editQty; editing.cat = editCat;
  closeEdit(); render(); toast('保存しました');
});
$('#delBtn').addEventListener('click', ()=>{
  if(!editing) return;
  items = items.filter(i=>i.id!==editing.id);
  closeEdit(); render(); toast('削除しました');
});

render();
</script>
</body>
</html>
