<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>おかいものメモ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#fbf6ec; --paper2:#f3ecdc; --card:#fffdf8;
    --ink:#3a352b; --ink-soft:#8a8472; --line:#e7ddc7;
    --green:#5b8a4f; --green-d:#456b3c; --green-soft:#e6efe0; --coral:#e0764f;
    --hot:#d23f22; --hot-soft:#fae0d8;
    --shadow:0 2px 0 #ece3cf, 0 8px 20px -10px rgba(80,70,40,.35);
    --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:'Zen Maru Gothic',system-ui,sans-serif;
    background:radial-gradient(120% 80% at 50% -10%, #fff8ea 0%, var(--paper) 55%) fixed;
    color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased;padding-bottom:120px;}
  .wrap{max-width:520px;margin:0 auto;padding:0 12px;}

  header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--paper) 72%, rgba(251,246,236,0));padding:12px 0 6px;}
  .titlebar{display:flex;align-items:center;gap:10px;}
  .logo{width:40px;height:40px;border-radius:12px;background:var(--green);color:#fff;display:grid;place-items:center;font-size:21px;box-shadow:0 3px 0 var(--green-d);transform:rotate(-4deg);}
  h1{font-size:20px;font-weight:900;margin:0;}
  .sub{font-size:11px;color:var(--ink-soft);margin-top:1px;}
  .gear{margin-left:auto;width:40px;height:40px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:19px;cursor:pointer;display:grid;place-items:center;}
  .gear:active{background:var(--paper2);}

  .tabs{display:flex;gap:4px;margin-top:11px;}
  .tabs button{flex:1;border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-soft);padding:9px 0;border-radius:12px 12px 0 0;border-bottom:none;cursor:pointer;transition:.15s;}
  .tabs button.active{color:var(--green-d);background:var(--green-soft);border-color:#cfe0c4;}

  .toolrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 2px;flex-wrap:wrap;}
  .count{font-size:13px;color:var(--ink-soft);font-weight:700;}
  .count b{color:var(--green-d);font-size:17px;}
  .count .yen{color:var(--ink);}
  .sortsel{font-family:inherit;font-weight:700;font-size:12px;color:var(--ink-soft);border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;cursor:pointer;outline:none;}
  .ghostbtn{border:1.5px solid var(--line);background:var(--card);font-family:inherit;font-weight:700;font-size:12px;color:var(--ink-soft);padding:7px 13px;border-radius:999px;cursor:pointer;}
  .ghostbtn:active{background:var(--paper2);}

  .seg2{display:flex;background:var(--paper2);border:1.5px solid var(--line);border-radius:999px;padding:3px;gap:2px;margin:10px 0 2px;}
  .seg2 button{flex:1;border:0;background:transparent;font-family:inherit;font-weight:700;font-size:13px;color:var(--ink-soft);padding:8px 0;border-radius:999px;cursor:pointer;transition:.15s;}
  .seg2 button.on{background:var(--green);color:#fff;box-shadow:0 2px 0 var(--green-d);}

  .addbar{display:flex;gap:8px;margin:12px 0;}
  .addbar input{flex:1;font-family:inherit;font-size:16px;font-weight:500;border:2px solid var(--line);background:var(--card);border-radius:13px;padding:12px 14px;color:var(--ink);outline:none;transition:.15s;}
  .addbar input:focus{border-color:var(--green);background:#fff;}
  .addbtn{border:0;background:var(--green);color:#fff;font-family:inherit;font-weight:900;font-size:15px;padding:0 18px;border-radius:13px;cursor:pointer;box-shadow:0 3px 0 var(--green-d);transition:.1s;white-space:nowrap;}
  .addbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green-d);}

  .grp{margin-top:15px;}
  .grphead{display:flex;align-items:center;gap:8px;margin:0 2px 7px;}
  .badge{font-size:12px;font-weight:900;padding:3px 9px;border-radius:8px;flex:none;}
  .grphead .nm{font-size:12px;font-weight:700;color:var(--ink-soft);}
  .grphead .ln{flex:1;height:1.5px;background:var(--line);border-radius:2px;}

  /* edit row */
  .erow{display:flex;align-items:center;gap:12px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:17px 16px;margin-bottom:9px;box-shadow:var(--shadow);touch-action:pan-y;cursor:pointer;transition:.1s;}
  .erow:active{transform:scale(.99);}
  .erow.has{border-color:#cfe0c4;background:#fff;}
  .erow.hot{border-color:#eebfb2;}
  .erow .bdg{font-size:11px;font-weight:900;padding:3px 7px;border-radius:7px;flex:none;}
  .erow .nm{flex:1;min-width:0;font-size:20px;font-weight:700;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .erow.has .nm{color:var(--ink);} .erow.hot .nm{color:var(--hot);}
  .erow .qbig{font-size:27px;font-weight:900;min-width:46px;text-align:center;color:#cbc4b2;line-height:1;}
  .erow.has .qbig{color:var(--ink);} .erow.hot .qbig{color:var(--hot);}
  .hint{font-size:12.5px;color:var(--ink-soft);text-align:center;margin:8px 0 2px;font-weight:700;}
  #editTab .addbar input{font-size:18px;padding:15px 16px;}
  #editTab .addbtn{font-size:17px;padding:0 22px;}
  .stepper{display:flex;align-items:center;flex:none;border:2px solid var(--line);border-radius:11px;overflow:hidden;}
  .stepper button{width:36px;height:36px;border:0;background:var(--paper2);font-size:20px;font-weight:900;color:var(--green-d);cursor:pointer;font-family:inherit;line-height:1;}
  .stepper button:active{background:#e8dcc2;}
  .stepper .v{min-width:30px;text-align:center;font-size:16px;font-weight:900;color:var(--ink);}
  .erow:not(.has) .stepper .v{color:#c9c2b0;} .erow.hot .stepper .v{color:var(--hot);}

  /* item (品目) row */
  .irow{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:12px 13px;margin-bottom:8px;box-shadow:var(--shadow);cursor:pointer;}
  .irow .idn{font-size:11px;font-weight:900;color:var(--ink-soft);background:var(--paper2);border-radius:6px;padding:2px 6px;flex:none;min-width:26px;text-align:center;}
  .irow .bdg{font-size:10px;font-weight:900;padding:2px 6px;border-radius:6px;flex:none;}
  .irow .nm{flex:1;min-width:0;font-size:16px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .irow .type{font-size:11px;color:var(--ink-soft);flex:none;}
  .irow .price{font-size:12px;font-weight:700;color:var(--green-d);flex:none;min-width:46px;text-align:right;}

  /* shop / list row */
  .srow{display:flex;align-items:center;gap:13px;background:var(--card);border:1.5px solid var(--line);border-radius:var(--radius);padding:15px 15px;margin-bottom:9px;box-shadow:var(--shadow);transition:.16s;}
  .srow:active{transform:scale(.99);}
  .srow.hot{border-color:#eebfb2;background:#fff;}
  .check{width:32px;height:32px;border-radius:9px;border:2.5px solid var(--line);flex:none;display:grid;place-items:center;cursor:pointer;transition:.15s;background:var(--paper);}
  .check svg{width:19px;height:19px;opacity:0;transform:scale(.4);transition:.18s;}
  .srow .body{flex:1;min-width:0;}
  .srow .nm{font-size:19px;font-weight:700;line-height:1.2;}
  .srow.hot .nm{color:var(--hot);}
  .srow .qty{font-size:13px;font-weight:800;color:var(--green-d);background:var(--green-soft);padding:1px 9px;border-radius:999px;margin-left:7px;}
  .srow.hot .qty{color:#fff;background:var(--hot);}
  .srow .bdg{font-size:10px;font-weight:900;padding:2px 7px;border-radius:7px;flex:none;}
  .srow.done{opacity:.5;}
  .srow.done .check{background:var(--green);border-color:var(--green);}
  .srow.done .check svg{opacity:1;transform:scale(1);}
  .srow.done .nm{text-decoration:line-through;text-decoration-color:var(--ink-soft);}

  .empty{text-align:center;color:var(--ink-soft);padding:46px 20px;font-weight:500;line-height:1.7;}
  .empty .e{font-size:38px;margin-bottom:8px;}

  .footer{position:fixed;left:0;right:0;bottom:0;z-index:50;padding:12px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(0deg,var(--paper) 65%, rgba(251,246,236,0));pointer-events:none;}
  .footer .inner{max-width:520px;margin:0 auto;pointer-events:auto;}
  .checkout{width:100%;border:0;font-family:inherit;font-weight:900;font-size:17px;color:#fff;background:var(--coral);padding:16px;border-radius:15px;cursor:pointer;box-shadow:0 4px 0 #b85733, 0 10px 24px -8px rgba(180,87,51,.5);transition:.1s;display:flex;align-items:center;justify-content:center;gap:8px;}
  .checkout:active{transform:translateY(3px);box-shadow:0 1px 0 #b85733;}
  .checkout:disabled{background:#cdc6b4;box-shadow:0 4px 0 #b3ab98;cursor:default;}

  .daygroup{margin-top:16px;}
  .dayhead{font-size:14px;font-weight:900;color:var(--green-d);margin:0 2px 8px;}
  .hitem{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 13px;margin-bottom:6px;}
  .hitem .dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none;}
  .hitem .hn{font-size:15px;font-weight:500;flex:1;}

  /* sheets */
  .sheetbg{position:fixed;inset:0;background:rgba(58,53,43,.45);z-index:70;opacity:0;pointer-events:none;transition:.2s;backdrop-filter:blur(2px);}
  .sheetbg.open{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:var(--paper);border-radius:24px 24px 0 0;max-width:520px;margin:0 auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(110%);transition:.28s cubic-bezier(.2,.8,.2,1);box-shadow:0 -10px 40px -10px rgba(0,0,0,.3);max-height:88vh;overflow-y:auto;}
  .sheet.open{transform:translateY(0);}
  .grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:6px auto 14px;}
  .sheet h3{margin:0 0 14px;font-size:18px;font-weight:900;}
  .field{margin-bottom:13px;}
  .field label{display:block;font-size:12px;font-weight:700;color:var(--ink-soft);margin-bottom:6px;}
  .field input{width:100%;font-family:inherit;font-size:17px;font-weight:500;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:11px 13px;outline:none;}
  .field input:focus{border-color:var(--green);}
  .row2{display:flex;gap:10px;} .row2 .field{flex:1;}
  .qstep{display:flex;align-items:center;gap:14px;}
  .qstep button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);background:var(--card);font-size:23px;font-weight:900;color:var(--green-d);cursor:pointer;font-family:inherit;}
  .qstep .v{font-size:21px;font-weight:900;min-width:34px;text-align:center;}
  .chips{display:flex;flex-wrap:wrap;gap:6px;}
  .chip{border:2px solid var(--line);background:var(--card);font-family:inherit;font-weight:700;font-size:12.5px;padding:6px 10px;border-radius:999px;cursor:pointer;color:var(--ink-soft);transition:.12s;}
  .chip.on{background:var(--green);color:#fff;border-color:var(--green);}
  .sheetbtns{display:flex;gap:10px;margin-top:6px;}
  .sheetbtns button{flex:1;font-family:inherit;font-weight:900;font-size:15px;padding:14px;border-radius:13px;cursor:pointer;border:0;}
  .b-del{background:var(--hot-soft);color:var(--hot);} .b-save{background:var(--green);color:#fff;box-shadow:0 3px 0 var(--green-d);}
  .b-done{background:var(--ink);color:#fff;}

  /* zone admin */
  .zrow{display:flex;align-items:center;gap:8px;background:var(--card);border:1.5px solid var(--line);border-radius:13px;padding:8px 9px;margin-bottom:7px;}
  .swatch{width:30px;height:30px;border-radius:8px;border:2px solid rgba(0,0,0,.06);flex:none;cursor:pointer;}
  .zrow .zc{font-size:12px;font-weight:900;flex:none;min-width:34px;text-align:center;color:var(--ink-soft);}
  .zrow input{flex:1;min-width:0;font-family:inherit;font-size:14px;font-weight:700;border:1.5px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 9px;outline:none;}
  .zrow input:focus{border-color:var(--green);}
  .zbtn{width:30px;height:30px;border:1.5px solid var(--line);background:var(--paper2);border-radius:8px;font-size:13px;font-weight:900;color:var(--green-d);cursor:pointer;font-family:inherit;flex:none;}
  .zbtn.del{color:var(--hot);}

  .toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:10px 18px;border-radius:999px;z-index:90;opacity:0;transition:.25s;box-shadow:0 8px 20px -6px rgba(0,0,0,.4);max-width:90%;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  body.fs header,body.fs .toolrow{display:none !important;}
  body.fs .wrap{padding-top:12px;}
  body.fs .srow{padding:18px 16px;} body.fs .srow .nm{font-size:21px;}
  .fsbtn{position:fixed;top:10px;right:12px;z-index:55;border:0;background:var(--ink);color:#fff;font-family:inherit;font-weight:900;font-size:13px;padding:9px 14px;border-radius:999px;cursor:pointer;box-shadow:0 6px 16px -6px rgba(0,0,0,.5);display:none;align-items:center;gap:6px;}
  body.fs .fsbtn{display:inline-flex;}
  .drag{width:24px;flex:none;display:grid;place-items:center;color:#c4bda9;font-size:18px;cursor:grab;touch-action:none;user-select:none;}
  .sortable-ghost{opacity:.35;}
  .sortable-chosen{box-shadow:0 0 0 2px var(--green);}
  .itemsbox{min-height:4px;}
  .hidden{display:none !important;}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.3/Sortable.min.js"></script>
</head>
<body>
<div class="wrap">
  <header>
    <div class="titlebar">
      <div class="logo">🧺</div>
      <div><h1>おかいものメモ</h1><div class="sub">売り場を回る順に</div></div>
      <button class="gear" id="gearBtn" title="売り場の管理">⚙</button>
    </div>
    <div class="tabs">
      <button class="active" data-tab="list">🛒 リスト</button>
      <button data-tab="edit">✏️ 編集</button>
      <button data-tab="item">📦 品目</button>
      <button data-tab="hist">📚 履歴</button>
    </div>
  </header>

  <!-- LIST -->
  <main id="listTab">
    <div class="toolrow">
      <div class="count">のこり <b id="remain">0</b> 品 ・ 合計 <span class="yen" id="listTotal">¥0</span></div>
      <div style="display:flex;gap:6px;">
        <select class="sortsel" id="listSort"></select>
        <button class="ghostbtn" id="fsEnter">⛶ 全画面</button>
      </div>
    </div>
    <div class="seg2" id="listSeg"><button class="on" data-seg="todo">未終了</button><button data-seg="done">終了</button></div>
    <div id="listArea"></div>
  </main>

  <!-- EDIT -->
  <main id="editTab" class="hidden">
    <div class="addbar"><input id="editAddInput" type="text" placeholder="臨時の品を追加（例：牛乳）" enterkeyhint="done"><button class="addbtn" id="editAddBtn">追加</button></div>
    <div class="toolrow">
      <div class="count">今回 <b id="tripCount">0</b> 品 ・ 合計 <span class="yen" id="editTotal">¥0</span></div>
      <div style="display:flex;gap:6px;">
        <select class="sortsel" id="editSort"></select>
        <button class="ghostbtn" id="clearBtn" style="color:var(--hot);border-color:#eebfb2;">全部クリア</button>
      </div>
    </div>
    <div class="hint">タップで ＋1 ・ 左にスワイプで −1</div>
    <div id="editArea"></div>
  </main>

  <!-- ITEM -->
  <main id="itemTab" class="hidden">
    <div class="addbar"><input id="addInput" type="text" placeholder="品目を追加（例：オリーブ油）" enterkeyhint="done"><button class="addbtn" id="addBtn">追加</button></div>
    <div class="toolrow">
      <div class="count">全 <b id="itemCount">0</b> 品目</div>
      <div style="display:flex;gap:6px;">
        <select class="sortsel" id="itemSort"></select>
        <button class="ghostbtn" id="renumBtn">番号振り直し</button>
      </div>
    </div>
    <div id="itemArea"></div>
  </main>

  <!-- HISTORY -->
  <main id="histTab" class="hidden"><div id="histArea"></div></main>
</div>

<button class="fsbtn" id="fsExit">✕ 全画面をとじる</button>

<div class="footer hidden" id="footer"><div class="inner"><button class="checkout" id="checkoutBtn" disabled><span>🛒</span><span id="checkoutTxt">カゴに入れたものを記録</span></button></div></div>

<!-- item edit sheet -->
<div class="sheetbg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="grab"></div>
  <h3 id="sheetTitle">品目の編集</h3>
  <div class="field"><label>なまえ</label><input id="fName" type="text"></div>
  <div class="row2">
    <div class="field"><label>商品id</label><input id="fId" type="number" inputmode="numeric"></div>
    <div class="field"><label>単価（円）</label><input id="fPrice" type="number" inputmode="numeric"></div>
  </div>
  <div class="field"><label>種別</label><div class="chips" id="typeChips"></div></div>
  <div class="field"><label>売り場</label><div class="chips" id="zoneChips"></div></div>
  <div class="field"><label>今回のこすう（0 なら買わない）</label><div class="qstep"><button id="qMinus">−</button><span class="v" id="qVal">0</span><button id="qPlus">＋</button></div></div>
  <div class="sheetbtns"><button class="b-del" id="delBtn">削除</button><button class="b-save" id="saveBtn">保存</button></div>
</div>

<!-- zone admin sheet -->
<div class="sheetbg" id="zoneBg"></div>
<div class="sheet" id="zoneSheet">
  <div class="grab"></div>
  <h3>売り場の管理（回る順）</h3>
  <div class="addbar"><input id="zAddCode" type="text" placeholder="記号" style="flex:none;width:80px;"><input id="zAddLabel" type="text" placeholder="売り場の名前"><button class="addbtn" id="zAddBtn">追加</button></div>
  <div id="zoneAdminArea" style="margin-top:6px;"></div>
  <div class="sheetbtns" style="margin-top:12px;"><button class="b-done" id="zoneDone">とじる</button></div>
</div>

<div class="sheetbg" id="confBg"></div>
<div class="sheet" id="confSheet" style="text-align:center;">
  <div class="grab"></div>
  <h3 id="confTitle">確認</h3>
  <p id="confMsg" style="font-size:14px;color:var(--ink-soft);margin:0 0 16px;line-height:1.6;"></p>
  <div class="sheetbtns"><button class="b-del" id="confNo">やめる</button><button class="b-save" id="confYes">OK</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ===== 色パレット ===== */
const FAM={
  paper:{bg:'#eceef0',ink:'#5b6470'}, veg:{bg:'#e6efe0',ink:'#456b3c'}, bread:{bg:'#f5ead6',ink:'#9a6f2e'},
  aisle:{bg:'#e7e9f5',ink:'#4b56a0'}, chill:{bg:'#d9f0eb',ink:'#27796b'}, meat:{bg:'#f7e1d8',ink:'#b85539'},
  fish:{bg:'#dceaf3',ink:'#356f99'}, aisle2:{bg:'#ede3f5',ink:'#7a4fa0'}, etc:{bg:'#eceae2',ink:'#7a756a'},
};
const PALETTE=Object.keys(FAM);

/* ===== 売り場（回る順・編集可） ===== */
let ZONES=[
  {code:'A',label:'紙物・日用紙',fam:'paper'},{code:'B',label:'野菜・果物',fam:'veg'},{code:'C',label:'野菜・きのこ',fam:'veg'},
  {code:'D',label:'パン・大豆製品',fam:'bread'},{code:'②-2',label:'通路② 奥',fam:'aisle'},{code:'②-1',label:'通路② 日用・ラップ',fam:'aisle'},
  {code:'①-2',label:'通路① 歯みがき等',fam:'aisle'},{code:'①-1',label:'通路① 冷凍',fam:'aisle'},{code:'H',label:'日用品コーナー',fam:'paper'},
  {code:'G',label:'冷蔵 乳製品・惣菜・麺',fam:'chill'},{code:'F',label:'精肉',fam:'meat'},{code:'E',label:'鮮魚',fam:'fish'},
  {code:'③-1',label:'お菓子',fam:'aisle2'},{code:'④-1',label:'コーヒー・お茶',fam:'aisle2'},{code:'④-2',label:'粉物・乾物',fam:'aisle2'},
  {code:'⑤-1',label:'味噌・だし',fam:'aisle2'},{code:'⑤-2',label:'レトルト',fam:'aisle2'},{code:'⑥-1',label:'調味料・麺',fam:'aisle2'},

function sortItems(items,key){
  const z=i=>(zoneIdx[i.zone]??999), t=i=>(typeIdx[i.type]??999);
  const cmp={
    zone:(a,b)=>z(a)-z(b)||a.id-b.id,
    id:(a,b)=>a.id-b.id,
    type:(a,b)=>t(a)-t(b)||z(a)-z(b)||a.id-b.id,
    price:(a,b)=>(b.price||0)-(a.price||0)||a.id-b.id,
    name:(a,b)=>a.name.localeCompare(b.name,'ja')||a.id-b.id,
  };
  return [...items].sort(cmp[key]||cmp.zone);
}
function groupItems(items,key){
  if(key==='zone'){const out=[];let c=null;for(const it of items){if(!c||c.code!==it.zone){c={kind:'zone',code:it.zone,items:[]};out.push(c);}c.items.push(it);}return out;}
  if(key==='type'){const out=[];let c=null;for(const it of items){if(!c||c.name!==it.type){c={kind:'type',name:it.type,items:[]};out.push(c);}c.items.push(it);}return out;}
  return [{kind:null,items}];
}
function groupHeader(g){
  if(g.kind==='zone'){const z=zoneOf(g.code);return `<div class="grphead">${bdg(g.code)}<span class="nm">${esc(z.label)}</span><span class="ln"></span></div>`;}

  return '';
}

function addFrom(inputSel,after){
  const inp=$(inputSel),raw=inp.value.trim();if(!raw)return;
  let name=raw,qty=1;const m=raw.match(/^(.+?)\s*[×x*]?\s*(\d+)$/);
  if(m){name=m[1].trim();qty=Math.min(99,parseInt(m[2]));}
  const maxId=catalog.reduce((a,b)=>Math.max(a,b.id),0);
  const zone=guessZone(name),type=guessType(name);
  catalog.push({uid:uidSeq++,id:maxId+1,name,type,zone,price:0,qty,done:false});
  inp.value='';after();toast(`「${name}」を追加（${zoneOf(zone).code}／${type}）`);
}

  askConfirm('今回の「買うもの」を全部クリア','個数をすべて0に戻します（品目リストは消えません）',()=>{
    catalog.forEach(i=>{i.qty=0;i.done=false;});renderEdit();toast('クリアしました');
  });
}

let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1900);}

function checkout(){
  const done=catalog.filter(i=>i.qty>0&&i.done);if(done.length===0)return;
  const now=new Date(),wd=['日','月','火','水','木','金','土'][now.getDay()];
  const dl=`${now.getMonth()+1}月${now.getDate()}日(${wd})`;
  const entries=sortItems(done,'zone').map(i=>({name:i.qty>1?`${i.name} ×${i.qty}`:i.name}));
  const day=history.find(d=>d.date===dl);
  if(day){day.list=entries.concat(day.list);}else{history.unshift({date:dl,list:entries});}
  done.forEach(i=>{i.qty=0;i.done=false;});
  renderList();renderHist();toast(`${done.length}こ を記録しました 🎉`);
}

  });
  $('#zoneAdminArea').innerHTML=html;
  if(zoneSortable){zoneSortable.destroy();zoneSortable=null;}
  if(typeof Sortable!=='undefined'){ zoneSortable=Sortable.create($('#zoneAdminArea'),{handle:'.drag',animation:150,onEnd:onZoneDrop}); }
}
function onZoneDrop(){
  const order=[...document.querySelectorAll('#zoneAdminArea .zrow')].map(r=>ZONES[+r.dataset.i]);
  ZONES=order;recomputeZones();renderZoneAdmin();
}
function openZoneAdmin(){renderZoneAdmin();$('#zoneBg').classList.add('open');$('#zoneSheet').classList.add('open');}
function closeZoneAdmin(){$('#zoneBg').classList.remove('open');$('#zoneSheet').classList.remove('open');recomputeZones();renderActive();}

/* ===== events ===== */
$('#addBtn').addEventListener('click',()=>addFrom('#addInput',renderItems));
$('#addInput').addEventListener('keydown',e=>{if(e.key==='Enter')addFrom('#addInput',renderItems);});
$('#editAddBtn').addEventListener('click',()=>addFrom('#editAddInput',renderEdit));
$('#editAddInput').addEventListener('keydown',e=>{if(e.key==='Enter')addFrom('#editAddInput',renderEdit);});
$('#clearBtn').addEventListener('click',clearAll);
$('#renumBtn').addEventListener('click',renumber);
$('#confBg').addEventListener('click',closeConfirm);
$('#confNo').addEventListener('click',closeConfirm);
$('#confYes').addEventListener('click',()=>{const cb=confirmCb;closeConfirm();if(cb)cb();});

document.querySelector('.tabs').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  [...document.querySelector('.tabs').children].forEach(x=>x.classList.remove('active'));b.classList.add('active');
  activeTab=b.dataset.tab;
  $('#listTab').classList.toggle('hidden',activeTab!=='list');
  $('#editTab').classList.toggle('hidden',activeTab!=='edit');
  $('#itemTab').classList.toggle('hidden',activeTab!=='item');
  $('#histTab').classList.toggle('hidden',activeTab!=='hist');
  $('#footer').classList.toggle('hidden',activeTab!=='list');
  renderActive();
});

$('#listSeg').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;listSeg=b.dataset.seg;[...$('#listSeg').children].forEach(x=>x.classList.toggle('on',x===b));renderList();});
$('#listSort').addEventListener('change',e=>{listSort=e.target.value;renderList();});
$('#editSort').addEventListener('change',e=>{editSort=e.target.value;renderEdit();});
$('#itemSort').addEventListener('change',e=>{itemSort=e.target.value;renderItems();});

let _sx=0,_sy=0,_su=null;
$('#editArea').addEventListener('pointerdown',e=>{const row=e.target.closest('.erow');if(!row){_su=null;return;}_su=+row.dataset.uid;_sx=e.clientX;_sy=e.clientY;});
$('#editArea').addEventListener('pointercancel',()=>{_su=null;});
$('#editArea').addEventListener('pointerup',e=>{
  if(_su==null)return;const uid=_su;_su=null;
  const it=catalog.find(i=>i.uid===uid);if(!it)return;
  const dx=e.clientX-_sx,dy=e.clientY-_sy;
  if(dx<-40&&Math.abs(dx)>Math.abs(dy)){it.qty=Math.max(0,it.qty-1);renderEdit();}
  else if(Math.abs(dx)<12&&Math.abs(dy)<12){it.qty=Math.min(99,it.qty+1);renderEdit();}
});
$('#itemArea').addEventListener('click',e=>{if(e.target.closest('.drag'))return;const row=e.target.closest('.irow');if(!row)return;const it=catalog.find(i=>i.uid===+row.dataset.uid);if(it)openEdit(it);});
$('#listArea').addEventListener('click',e=>{const row=e.target.closest('.srow');if(!row)return;const it=catalog.find(i=>i.uid===+row.dataset.uid);if(it){it.done=!it.done;renderList();}});

$('#checkoutBtn').addEventListener('click',checkout);
$('#fsEnter').addEventListener('click',()=>document.body.classList.add('fs'));
$('#fsExit').addEventListener('click',()=>document.body.classList.remove('fs'));

/* item sheet */
$('#sheetBg').addEventListener('click',closeEdit);
$('#qMinus').addEventListener('click',()=>{editQty=Math.max(0,editQty-1);$('#qVal').textContent=editQty;});
$('#qPlus').addEventListener('click',()=>{editQty=Math.min(99,editQty+1);$('#qVal').textContent=editQty;});
$('#typeChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;editType=b.dataset.type;renderTypeChips();});
$('#zoneChips').addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;editZone=b.dataset.zone;renderZoneChips();});
$('#saveBtn').addEventListener('click',()=>{
  if(!editing)return;
  editing.name=$('#fName').value.trim()||editing.name;
  const idv=parseInt($('#fId').value);if(!isNaN(idv))editing.id=idv;
  const pv=parseInt($('#fPrice').value);editing.price=isNaN(pv)?0:Math.max(0,pv);
  editing.type=editType;editing.zone=editZone;editing.qty=editQty;
  closeEdit();renderItems();toast('保存しました');
});
$('#delBtn').addEventListener('click',()=>{if(!editing)return;const u=editing.uid;catalog=catalog.filter(i=>i.uid!==u);closeEdit();renderItems();toast('削除しました');});

/* zone admin */
$('#gearBtn').addEventListener('click',openZoneAdmin);
$('#zoneDone').addEventListener('click',closeZoneAdmin);
$('#zoneBg').addEventListener('click',closeZoneAdmin);
$('#zAddBtn').addEventListener('click',()=>{
  const code=$('#zAddCode').value.trim(),label=$('#zAddLabel').value.trim();
  if(!code){toast('記号を入れてね');return;}
  if(ZONES.some(z=>z.code===code)){toast('その記号はもうあるよ');return;}
  ZONES.splice(ZONES.length-1,0,{code,label:label||code,fam:'etc'}); // その他の手前に
  recomputeZones();$('#zAddCode').value='';$('#zAddLabel').value='';renderZoneAdmin();
});
$('#zoneAdminArea').addEventListener('click',e=>{
  const btn=e.target.closest('button[data-act]');if(!btn)return;
  const i=+e.target.closest('.zrow').dataset.i;const act=btn.dataset.act;
  if(act==='color'){const z=ZONES[i];z.fam=PALETTE[(PALETTE.indexOf(z.fam)+1)%PALETTE.length];}
  else if(act==='del'){
    if(ZONES[i].code==='その他'){toast('「その他」は消せないよ');return;}
    const code=ZONES[i].code;catalog.forEach(it=>{if(it.zone===code)it.zone='その他';});
    ZONES.splice(i,1);
  } else return;
  recomputeZones();renderZoneAdmin();
});
$('#zoneAdminArea').addEventListener('input',e=>{
  const inp=e.target.closest('input[data-act="label"]');if(!inp)return;
  const i=+e.target.closest('.zrow').dataset.i;ZONES[i].label=inp.value;
});

/* init */
fillSort($('#listSort'),listSort);fillSort($('#editSort'),editSort);fillSort($('#itemSort'),itemSort);
renderList();
</script>
</body>
</html>
